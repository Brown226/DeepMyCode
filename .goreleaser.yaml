version: 2
project_name: deepmycode

before:
  hooks:
    - go mod download

builds:
  - id: deepmycode
    main: ./cmd/reasonix
    binary: deepmycode
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Tag }}
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]

archives:
  - id: deepmycode
    ids: [deepmycode]
    name_template: "deepmycode-{{ .Os }}-{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: SHA256SUMS
  algorithm: sha256

homebrew_casks:
  - name: deepmycode
    ids: [deepmycode]
    # Prereleases (v*-rc*) must not update the stable tap; brew has no separate
    # prerelease channel, so a pushed rc cask becomes the default `brew install`.
    skip_upload: "auto"
    repository:
      owner: esengine
      name: homebrew-deepmycode
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: "https://github.com/Brown226/DeepMyCode"
    description: "Cache-first DeepSeek coding agent for the terminal."
    commit_author:
      name: deepmycode
      email: deepmycode@deepseek.com
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/deepmycode"]
          end

release:
  prerelease: auto
  name_template: "DeepMyCode CLI {{ .Tag }}"
